<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/Masteremployeepage}">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <title> State Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">


    <style>
        body {
            background-color: #f4f6f9;
        }

    </style>

</head>
<body class="bg-light">
<div layout:fragment="content">
<div class="container-fluid">
    <div class="row">




        <div class="col-md-12 p-4 text-center">
            <h2 class="mb-4">Property Purpose Details</h2>


            <div class="row justify-content-center mt-4">

                <div class="col-md-4">
                    <div class="card shadow">
                        <div class="card-body">
                            <h4 class="text-center mb-4"> Property Purpose</h4>
                            <form th:action="@{/PPurpose}" th:method="post">

                                <div class="mb-3">
                                    <input type="hidden" id="propertyPurposeID" th:value="${propertyPurposeID}" name="propertyPurposeID" >
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Purpose</label>
                                    <input type="text" class="form-control" id="purposeName" name="purposeName" placeholder="Enter purpose">
                                </div>
                                <button  class="btn btn-primary w-25">
                                    Submit
                                </button>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
</body>
</html>
