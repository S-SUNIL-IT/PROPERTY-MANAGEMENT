<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/Masteremployeepage}">

<head>

    <meta charset="UTF-8">
    <title>Tenant List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>

        .search-wrapper{
        display:flex;
        justify-content:center;
        margin-top:10px;
        }

        .search-container{
        position:relative;
        width:420px;
        }

        .search-icon{
        position:absolute;
        left:18px;
        top:50%;
        transform:translateY(-50%);
        color:#777;
        }

        #searchBox{
        width:100%;
        padding:12px 18px 12px 45px;
        border-radius:30px;
        border:1px solid #ccc;
        box-shadow:0 3px 10px rgba(0,0,0,0.1);
        }

        #suggestions{
        position:absolute;
        width:100%;
        background:white;
        border-radius:12px;
        margin-top:8px;
        box-shadow:0 5px 15px rgba(0,0,0,0.15);
        display:none;
        max-height:250px;
        overflow-y:auto;
        }

        .suggest-item{
        padding:12px;
        cursor:pointer;
        }

        .suggest-item:hover{
        background:#0d6efd;
        color:white;
        }

    </style>

    <script>

        $(document).ready(function () {


            function loadTenant(keyword){

                $.ajax({
                    url:"/searchTenant",
                    type:"GET",
                    data:{keyword:keyword},

                    success:function(data){

                        let rows="";

                        data.forEach(function(t,index){

                            let collapseId="prop"+index;

                            rows+=`
                            <tr>
                                <td>
                                    <a data-bs-toggle="collapse"
                                       href="#${collapseId}">
                                       <i class="fa-solid fa-chevron-right"></i>
                                    </a>
                                </td>
                                <td>${t.firstName}</td>
                                <td>${t.email}</td>
                                <td>${t.mobile}</td>
                                <td>${t.address}</td>
                                <td>${t.stateName}</td>
                                <td>${t.countryName}</td>
                            </tr>

                            <tr id="${collapseId}" class="collapse">
                            <td colspan="7">

                            <table class="table table-sm table-bordered mt-2">

                            <thead class="table-secondary">
                                <tr>
                                    <th>Property Name</th>
                                    <th>Property Address</th>
                                    <th>Action</th>
                                </tr>
                            </thead>

                            <tbody>
                            `;

                            if(t.properties && t.properties.length>0){

                              t.properties.forEach(function(p){



    rows+=`
    <tr id="row-${p.propertyId}">
        <td>${p.propertyName}</td>
        <td>${p.propertyAddress}</td>
        <td>
            <button class="btn btn-danger btn-sm releaseBtn"
                data-id="${p.propertyId}">
                Release
            </button>
        </td>
    </tr>`;
});

                            }else{

                                rows+=`
                                <tr>
                                    <td colspan="3">No Property Found</td>
                                </tr>`;
                            }

                            rows+=`
                            </tbody>
                            </table>

                            </td>
                            </tr>`;
                        });

                        $("#tenantTableBody").html(rows);
                    }
                });
            }



            loadTenant("");



            $("#searchBox").keyup(function(){

                let keyword=$(this).val();

                loadTenant(keyword);

                if(keyword.length===0){
                    $("#suggestions").hide().empty();
                    return;
                }

                $.ajax({
                    url:"/tenantSuggestion",
                    type:"GET",
                    data:{keyword:keyword},

                    success:function(data){

                        let suggest="";

                        data.forEach(function(t){

                            suggest+=`
                            <div class="suggest-item list-group-item"
                                 data-name="${t.firstName}">
                                 ${t.firstName}
                            </div>`;
                        });

                        $("#suggestions").html(suggest).show();
                    }
                });
            });



            $(document).on("click",".suggest-item",function(){

                let name=$(this).data("name");

                $("#searchBox").val(name);

                $("#suggestions").hide().empty();

                loadTenant(name);
            });



            $(document).click(function(e){

                if(!$(e.target).closest(".search-container").length){
                    $("#suggestions").hide();
                }
            });



$(document).on("click", ".releaseBtn", function () {

    var propertyId = $(this).data("id");

    console.log("Clicked propertyId =", propertyId);

    $.ajax({
        url: "/releaseProperty",
        type: "POST",
        contentType: "application/json",
        data: JSON.stringify({
            propertyId: propertyId
        }),
        success: function (response) {
            alert(response);
            $("#row-" + propertyId).remove();
        },

    });
});
        });

    </script>

</head>

<body>

<div layout:fragment="content">

    <div class="row justify-content-center mt-4 mb-3 p-2">

        <div class="col-md-8">

            <div class="card shadow text-center p-2">

                <h5>Tenant List</h5>

                <div class="search-wrapper mb-3">

                    <div class="search-container">

                        <i class="fa-solid fa-magnifying-glass search-icon"></i>

                        <input type="text"
                               id="searchBox"
                               placeholder="Search tenant name..."
                               autocomplete="off">

                        <div id="suggestions"></div>

                    </div>
                </div>


                <div class="table-responsive">

                    <table class="table table-bordered table-striped">

                        <thead class="table-dark">
                        <tr>
                            <th></th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>Address</th>
                            <th>State</th>
                            <th>Country</th>
                        </tr>
                        </thead>

                        <tbody id="tenantTableBody">
                        <!-- AJAX DATA LOADS HERE -->
                        </tbody>

                    </table>

                </div>

            </div>
        </div>
    </div>

</div>

</body>
</html>
