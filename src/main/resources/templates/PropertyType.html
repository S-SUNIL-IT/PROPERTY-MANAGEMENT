<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/Masteremployeepage}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<style>
    body {
        background-color: #f4f6f9;
    }
    .card {
        border-radius: 15px;
    }
    .card i {
        font-size: 40px;
    }
</style>
</head>
<body>
<div layout:fragment="content">
<div class="container-fluid">
    <div class="row">

        <div class="col-md-12 p-4 text-center">
            <h2 class="mb-4">PropertyType Details</h2>


            <div class="row justify-content-center mt-4">

                <div class="col-md-4">
                    <div class="card shadow">
                        <div class="card-body">
                            <h4 class="text-center mb-4"> Property Type</h4>
                            <form th:action="@{/PropertyTypess}" method="post">

                                <input type="hidden" name="PropertyTypeID"
                                       th:value="${PropertyTypeID}">

                                <div class="mb-3">
                                    <label class="form-label">Property Type Name</label>
                                    <input type="text" class="form-control" name="PropertyTypeName" placeholder="Residential / Commercial" required>
                                </div>

                                <button class="btn btn-primary w-25">
                                    Submit
                                </button>


                            </form>
    </div>
</div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
</body>
</html>
