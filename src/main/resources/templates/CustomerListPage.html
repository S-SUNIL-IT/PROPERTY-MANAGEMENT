<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/Masteremployeepage}">
<head>
    <meta charset="UTF-8">
    <title>TenantList</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div layout:fragment="content">
<div class="row justify-content-center mt-4 mb-3 p-2">

    <div class="col-md-8">

        <div class="card shadow text-center p-4">

            <h5>View Customer</h5>
            <div class="table-responsive">
            <table class="table table-bordered table-striped mt-3">

                <thead class="table-dark">

                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>address</th>
                    <th>PropertyName</th>
                    <th>Property Address</th>
                    <th>State</th>
                    <th>Country</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="cus : ${customerlist}">

                    <td th:text="${cus.customer.FirstName}"></td>

                    <td th:text="${cus.customer.Email}"></td>

                    <td th:text="${cus.customer.Mobile}"></td>

                    <td th:text="${cus.customer.Address}"></td>

                    <td th:text="${cus.propertyName}"></td>

                    <td th:text="${cus.propertyAddress}"></td>

                    <td th:text="${cus.customer.state.stateName}"></td>

                    <td th:text="${cus.customer.country.countryName}"></td>



                </tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>
</div>
</div>
</body>
</html>
