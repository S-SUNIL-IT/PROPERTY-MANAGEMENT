<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/Masteremployeepage}">

<head>
    <meta charset="UTF-8">
    <title>CustomerList</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        .search-wrapper{
            display:flex;
            justify-content:center;
            margin-top:10px;
        }


        .search-container{
            position:relative;
            width:420px;
        }


        .search-icon{
            position:absolute;
            left:18px;
            top:50%;
            transform:translateY(-50%);
            color:#777;
            font-size:16px;
        }


        #searchBox{
            width:100%;
            padding:12px 18px 12px 45px;
            border-radius:30px;
            border:1px solid #ccc;
            outline:none;
            font-size:15px;
            transition:0.3s;
            box-shadow:0 3px 10px rgba(0,0,0,0.1);
        }


        #searchBox:focus{
            border-color:#0d6efd;
            box-shadow:0 0 12px rgba(13,110,253,0.4);
        }


        #suggestions{
            position:absolute;
            width:100%;
            background:white;
            border-radius:12px;
            margin-top:8px;
            box-shadow:0 5px 15px rgba(0,0,0,0.15);
            display:none;
            max-height:250px;
            overflow-y:auto;
        }


        .suggest-item{
            padding:12px;
            cursor:pointer;
        }

        .suggest-item:hover{
            background:#0d6efd;
            color:white;
        }</style>

    <script>

        $(document).ready(function () {


            function loadCustomer(Value){

                $.ajax({
                    url: "/searchCustomer",
                    type: "GET",
                    data: { Value: Value },

                    success: function(data){

                        let rows = "";

                        data.forEach(function(c, index){

                            let collapseId = "prop" + index;

                            rows += `
                            <tr>
                                <td>
                                    <a data-bs-toggle="collapse"
                                       href="#${collapseId}"
                                       role="button">
                                       <i class="fa-solid fa-chevron-right"></i>
                                    </a>
                                </td>
                                <td>${c.firstName}</td>
                                <td>${c.email}</td>
                                <td>${c.mobile}</td>
                                <td>${c.address}</td>
                                <td>${c.stateName}</td>
                                <td>${c.countryName}</td>
                            </tr>

                            <tr id="${collapseId}" class="collapse">
                                <td colspan="7">

                                <table class="table table-sm table-bordered mt-2">
                                    <thead class="table-secondary">
                                        <tr>
                                            <th>Property Name</th>
                                            <th>Property Address</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                            `;

                            if(c.properties && c.properties.length > 0){

                                c.properties.forEach(function(p){
                                    rows += `
                                        <tr>
                                            <td>${p.propertyName}</td>
                                            <td>${p.propertyAddress}</td>
                                        </tr>`;
                                });

                            }else{

                                rows += `
                                    <tr>
                                        <td colspan="2">No Property Found</td>
                                    </tr>`;
                            }

                            rows += `
                                    </tbody>
                                </table>

                                </td>
                            </tr>`;
                        });

                        $("#customerTableBody").html(rows);
                    }
                });
            }



            $("#searchBox").on("keyup", function(){

                let Value = $(this).val();


                loadCustomer(Value);


                if(Value.length === 0){
                    $("#suggestions").hide().empty();
                    return;
                }


                $.ajax({
                    url: "/customerSuggestion",
                    type: "GET",
                    data: { Value: Value },

                    success: function(data){

                        let suggest = "";

                        data.forEach(function(c){

                            suggest += `
                                <div class="suggest-item"
                                     data-name="${c.firstName}">
                                     ${c.firstName}
                                </div>`;
                        });

                        $("#suggestions").html(suggest).show();
                    }
                });
            });



            $(document).on("click",".suggest-item",function(){

                let name = $(this).data("name");

                $("#searchBox").val(name);

                $("#suggestions").hide().empty();


                loadCustomer(name);
            });


            $(document).click(function(e){

                if(!$(e.target).closest(".search-container").length){
                    $("#suggestions").hide();
                }
            });

        });

    </script>

</head>

<body>

<div layout:fragment="content">

    <div class="row justify-content-center mt-4 mb-3 p-2">

        <div class="col-md-8">

            <div class="card shadow text-center p-2">

                <h5>Customer List</h5>

                <div class="search-wrapper mb-3">
                    <div class="search-container">

                        <i class="fa-solid fa-magnifying-glass search-icon"></i>

                        <input type="text"
                               id="searchBox"
                               placeholder="Search tenant name..."
                               autocomplete="off">

                        <div id="suggestions"></div>
                    </div>
                </div>


                <div class="table-responsive">

                    <table class="table table-bordered table-striped mt-3">

                        <thead class="table-dark">

                        <tr>
                            <th></th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>Address</th>
                            <th>State</th>
                            <th>Country</th>
                        </tr>
                        </thead>

                        <tbody id="customerTableBody">

                        <th:block th:each="cus, stat : ${customerlist}">


                            <tr>

                                <td>
                                    <a data-bs-toggle="collapse"
                                       th:href="'#prop' + ${stat.index}">
                                        <i class="fa-solid fa-chevron-right"></i>
                                    </a>
                                </td>

                                <td th:text="${cus.firstName}"></td>
                                <td th:text="${cus.email}"></td>
                                <td th:text="${cus.mobile}"></td>
                                <td th:text="${cus.address}"></td>
                                <td th:text="${cus.stateName}"></td>
                                <td th:text="${cus.countryName}"></td>

                            </tr>


                            <tr th:id="'prop' + ${stat.index}" class="collapse">

                                <td colspan="7">

                                    <table class="table table-sm table-bordered mt-2">

                                        <thead class="table-secondary">
                                        <tr>
                                            <th>Property Name</th>
                                            <th>Property Address</th>
                                        </tr>
                                        </thead>

                                        <tbody>

                                        <tr th:if="${#lists.isEmpty(cus.properties)}">
                                            <td colspan="2">No Properties Available</td>
                                        </tr>

                                        <tr th:each="prop : ${cus.properties}">
                                            <td th:text="${prop.propertyName}"></td>
                                            <td th:text="${prop.propertyAddress}"></td>
                                        </tr>

                                        </tbody>

                                    </table>

                                </td>

                            </tr>

                        </th:block>

                        </tbody>

                    </table>

                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
