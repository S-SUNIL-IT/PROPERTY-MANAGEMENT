<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/Masteremployeepage}">

<head>
    <meta charset="UTF-8">
    <title>Rent Reminder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div layout:fragment="content">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-12">

                <div class="card shadow">

                    <div class="card-body">

                        <h3 class="text-center mb-4">
                            Rent Reminder
                        </h3>
                        <form th:action="@{|/SendReminder/${tenantmapid}|}" method="post">
                        <p>
                            <strong>Tenant:</strong>
                            <span th:text="${tenant.firstname}"></span>
                        </p>

                        <p>
                            <strong>Property:</strong>
                            <span th:text="${property.propertyName}"></span>
                        </p>

                        <p>
                            <strong>Rent Amount:</strong>
                            ₹<span th:text="${rentAmount}"></span>
                        </p>

                        <div class="text-center mt-4">

                            <a th:href="@{/RentFollowUPPage}"
                               class="btn btn-secondary">
                                Back
                            </a>

                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-bell-fill"></i>
                                Send Reminder
                            </button>

                        </div>
                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
