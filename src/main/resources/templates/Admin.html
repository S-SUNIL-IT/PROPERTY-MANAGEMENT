<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/MasterAdmin}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">



    <style>
            body {
                background-color: #f4f6f9;
            }
             .card {
                border-radius: 15px;
            }
            .card i {
                font-size: 40px;
            }

            .card {
                border-radius: 12px;
            }
.search-container{
    position:relative;
    width:60%;
    margin:auto;
}


.search-container i{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    color:gray;
    font-size:18px;
    z-index:2;
}


.search-container .search-input{
    padding-left:55px ;
    height:45px;
    border-radius:30px;
}

    </style>

        <meta charset="UTF-8">
        <title>Admin Dashboard</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">


        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    </head>
    <body>
    <div layout:fragment="content">
    <div class="container-fluid">
        <div class="row">

        <div class="col-md-12 p-4">
            <h2 class="mb-3 text-center">Welcome Admin</h2>

            <div class="row justify-content-center mt-4 mb-3 p-4">
                <div class="col-md-4">
                    <div class="card shadow text-center p-4">
                        <i class="bi bi-person-plus-fill text-primary mb-3"></i>
                        <h5>Add Admin</h5>
                        <p class="text-muted">Create and Add Admin.</p>
                        <a th:href="@{|/SignUp|}" class="btn btn-primary w-25 mx-auto d-block">
                            ADD
                        </a>
                    </div>
                </div>
            </div>


            <div class="row justify-content-center mt-4 mb-3 p-4">
                    <div class="col-md-4">
                    <div class="card shadow text-center p-4">
                        <i class="bi bi-people-fill text-primary mb-3"></i>
                        <h5>Add Employee</h5>
                        <p class="text-muted">Create and Add Employee.</p>
                        <a th:href="@{|/RegisterEmployee|}" class="btn btn-primary w-25 mx-auto d-block">
                            Register
                        </a>
                    </div>
                    </div>
                </div>

            <div class="row justify-content-center mt-4 mb-3 p-4">
                <div class="col-md-7">
                    <div  class="card shadow text-center p-4">
                        <h5>Search Admin</h5>
                        <form th:action="@{/Search}" th:object="${admin}" method="post" class="mb-3">

                            <div class="search-container">

                                <i class="fa-solid fa-magnifying-glass"></i>

                                <input type="text" id="mobile" name="mobile" placeholder="Enter Mobile" class="form-control search-input">
                            </div>
                            <button class="btn btn-primary w-25 mt-2">Search</button>
                            <div class="table-responsive">
                            <table class="table table-bordered mt-2">
                                <thead>
                                <tr>
                                    <th>AdminID</th>
                                    <th>FirstName</th>
                                    <th>LastName</th>
                                    <th>Email</th>
                                    <th>DateOfBirth</th>
                                    <th>Password</th>
                                    <th>Mobile</th>
                                    <th>Edit</th>
                                    <th>Delete</th>


                                </tr>
                                </thead>


                                <tr th:each="S : ${Text}">
                                    <td th:text="${S.AdminID}"></td>
                                    <td th:text="${S.FirstName}"></td>
                                    <td th:text="${S.LastName}"></td>
                                    <td th:text="${S.Email}"></td>
                                    <td th:text="${S.DateOfBirth}"></td>
                                    <td th:text="${S.Password}"></td>
                                    <td th:text="${S.Mobile}"></td>

                                    <td><a th:href="@{|/Edit/${S.AdminID}|}" class="btn btn-success">EDIT</a></td>
                                    <td><a th:href="@{|/Delete/${S.AdminID}|}" class="btn btn-danger">DELETE</a></td>

                                </tr>
                            </table>
                            <p th:text="${Errors}"></p>
                            </div>
                        </form>

                    </div>


            </div>
        </div>
            </div>
        </div>
    </div>


</div>
</body>
</html>
