<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/Masteremployeepage}">

<head>
    <meta charset="UTF-8">
    <title>Rent History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .table th{
            text-align:center;
        }

        .table td{
            vertical-align:middle;
            text-align:center;
        }
    </style>

</head>

<body>

<div layout:fragment="content">

    <div class="container-fluid">

        <div class="row">

            <div class="col-md-12 text-center">

                <h2 class="mb-3">
                    Rent History
                </h2>

                <div class="row justify-content-center">

                    <div class="col-md-11">

                        <div class="card shadow">

                            <div class="card-body">

                                <h4 class="mb-4">
                                    Payment History
                                </h4>

                                <div class="row mb-4">

                                    <form th:action="@{/RentHistory}" method="get">

                                        <div class="row">

                                            <div class="col-md-4">

                                                <label>Property Name</label>

                                                <input type="text"
                                                       class="form-control"
                                                       name="propertyName"
                                                       placeholder="Enter Property Name">

                                            </div>

                                            <div class="col-md-3">

                                                <label>From Month</label>

                                                <input type="month"
                                                       class="form-control"
                                                       name="startMonth">

                                            </div>

                                            <div class="col-md-3">

                                                <label>To Month</label>

                                                <input type="month"
                                                       class="form-control"
                                                       name="endMonth">

                                            </div>

                                            <div class="col-md-2 d-flex align-items-end">

                                                <button class="btn btn-primary w-100">

                                                    <i class="bi bi-search"></i>
                                                    Search

                                                </button>

                                            </div>

                                        </div>

                                    </form>

                                </div>



                                <div class="table-responsive">

                                    <table class="table table-bordered table-striped">

                                        <thead class="table-dark">

                                        <tr>

                                            <th>S.No</th>

                                            <th>Tenant Name</th>

                                            <th>Property</th>

                                            <th>Month</th>

                                            <th>Amount</th>

                                            <th>Payment Mode</th>

                                            <th>Reference No</th>

                                            <th>Paid Date</th>

                                            <th>Status</th>

                                        </tr>

                                        </thead>

                                        <tbody>

                                        <tr th:each="payment,status : ${payments}">

                                            <td th:text="${status.count}"></td>

                                            <td th:text="${payment.tenantMap.tenant.firstname}"></td>

                                            <td th:text="${payment.tenantMap.property.propertyName}"></td>

                                            <td th:text="${payment.month}"></td>

                                            <td th:text="${payment.amount}"></td>

                                            <td th:text="${payment.paymentMode}"></td>

                                            <td th:text="${payment.paymentReference}"></td>

                                            <td th:text="${payment.paidDate}"></td>

                                            <td>

                                                <span class="badge bg-success"
                                                      th:text="${payment.status}">
                                                </span>

                                            </td>

                                        </tr>

                                        <tr th:if="${#lists.isEmpty(payments)}">

                                            <td colspan="9">

                                                No Payment History Available

                                            </td>

                                        </tr>

                                        </tbody>

                                    </table>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
