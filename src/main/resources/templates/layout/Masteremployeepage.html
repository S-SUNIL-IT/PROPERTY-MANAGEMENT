<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>

    <meta charset="UTF-8">
    <title layout:title-pattern="$CONTENT_TITLE - PMS">
        Employee Dashboard
    </title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1">


    <style>

        body {
            background-color: #f4f6f9;
            overflow-x:hidden;
        }

        .sidebar {
            height: 200vh;
            background-color: #0d6efd;
            position: fixed;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            display: block;
        }

        .sidebar a:hover {
            background-color: rgba(255,255,255,0.2);
        }

        .card {
            border-radius: 15px;
        }

        .container {
            display: flex;
            align-items: stretch;
        }

    </style>

</head>

<body>

<div class="container-fluid">
    <div class="row">


        <div class="col-md-2 sidebar p-0">

            <h4 class="text-center py-4 text-white">Employee Panel</h4>

            <a th:href="@{/MainEmployee}">
                <i class="bi bi-speedometer2 me-2"></i>Dashboard
            </a>

            <a th:href="@{/Customer}">
                <i class="bi bi-person-plus me-2"></i>Add Customer
            </a>

            <a th:href="@{/Tenant}">Add Tenant</a>
            <a th:href="@{/CountryPage}">Add Country</a>
            <a th:href="@{/StatePage}">Add State</a>
            <a th:href="@{/PropertyTypes}">Add PropertyType</a>
            <a th:href="@{/PropertySubTypes}">Add PropertySubType</a>
            <a th:href="@{/PropertySizes}">Add Property Size</a>
            <a th:href="@{/PropertyPurposes}">Add Property Purpose</a>
            <a th:href="@{/Property}">Add Property</a>
            <a th:href="@{/View}">View Tenants</a>
            <a th:href="@{/customerview}">View Customer</a>

        </div>
        <div class="main-content">
        <div class="col-md-10 offset-md-2 p-4"
             layout:fragment="content">
        </div>

    </div>
</div>
</div>

</body>
</html>
