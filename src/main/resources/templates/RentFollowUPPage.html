<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/Masteremployeepage}">

<head>
    <meta charset="UTF-8">
    <title>Rent FollowUp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .table th{
            text-align:center;
        }

        .table td{
            vertical-align:middle;
            text-align:center;
        }
    </style>

</head>

<body>

<div layout:fragment="content">

    <div class="container-fluid">

        <div th:if="${success}"
             class="alert alert-success text-center">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${success}"
             class="alert alert-success text-center">
            <span th:text="${success}"></span>
        </div>

        <div th:if="${error}"
             class="alert alert-danger text-center">
            <span th:text="${error}"></span>
        </div>

        <div class="row">

            <div class="col-md-12 text-center">

                <h2 class="mb-3">
                    Rent Follow Up
                </h2>

                <div class="row justify-content-center">

                    <div class="col-md-11">

                        <div class="card shadow">

                            <div class="card-body">

                                <h4 class="mb-4">
                                    Rent Follow Up
                                </h4>

                                <div class="row mb-4">

                                    <form th:action="@{/RentFollowUPPage}" method="get">

                                        <div class="row justify-content-center align-items-end">

                                            <div class="col-md-8">

                                                <label>Property Name</label>

                                                <input type="text"
                                                       class="form-control"
                                                       name="propertyName"
                                                       placeholder="Enter Property Name">

                                            </div>

                                            <div class="col-md-4">

                                                <button class="btn btn-primary w-100">

                                                    <i class="bi bi-search"></i>
                                                    Search

                                                </button>

                                            </div>

                                        </div>
                                    </form>

                                </div>



                                <div class="table-responsive">

                                    <table class="table table-bordered table-striped">

                                        <thead class="table-dark">

                                        <tr>

                                            <th>S.No</th>

                                            <th>Tenant Name</th>

                                            <th>Property</th>

                                            <th>Month</th>

                                            <th>Amount</th>

                                            <th>Mobile</th>

                                            <th>Status</th>

                                            <th>Action</th>

                                        </tr>

                                        </thead>

                                        <tbody>

                                        <tr th:each="payment,status : ${payments}">

                                            <td th:text="${status.count}"></td>

                                            <td th:text="${payment.tenantName}"></td>

                                            <td th:text="${payment.propertyName}"></td>

                                            <td th:text="${payment.month}"></td>

                                            <td th:text="${payment.amount}"></td>

                                            <td th:text="${payment.mobile}"></td>

                                            <td>
        <span class="badge bg-danger"
              th:text="${payment.status}">
        </span>
                                            </td>

                                            <td>
                                                <a th:href="@{|/Reminder/${payment.tenantmapid}|}"
                                                   class="btn btn-warning">
                                                    <i class="bi bi-bell-fill"></i>
                                                    Reminder
                                                </a>
                                            </td>

                                        </tr>

                                        <tr th:if="${#lists.isEmpty(payments)}">

                                            <td colspan="8" class="text-center">

                                                No Pending Rent

                                            </td>

                                        </tr>

                                        </tbody>

                                    </table>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
