
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px;
        }

        .chat-container {
            max-width: 750px;
            margin: 30px auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px #00000015;
        }

        h2 {
            color: #1e3a8a;
        }

        #messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user {
            background: #dbeafe;
            text-align: right;
        }

        .bot {
            background: #f1f5f9;
        }

        form {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>
<div class="chat-container">
    <h2 class="text-center">AI ChatBot</h2>
    <p>Ask me anything</p>

    <div id="messages" aria-live="polite">
        <div class="message bot">
            Hello what's your mind?
        </div>
    </div>

    <form id="chatForm">
        <input id="messageInput"
               type="text"
               placeholder="Type your message..."
               autocomplete="off"
               required>

        <button type="submit">Send</button>
    </form>
</div>

<script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const message = input.value.trim();
        if (!message) return;

        addMessage("You: " + message, "user");
        input.value = "";

        const loading = addMessage("AI is thinking...", "bot");

        try {
            const response = await fetch(
                "/ai/chat?message=" + encodeURIComponent(message)
            );

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            loading.textContent = "AI: " + await response.text();
        } catch (error) {
            loading.textContent =
                "Unable to connect to AI. Please check your application and Ollama.";
            console.error(error);
        }
    });

    function addMessage(text, sender) {
        const div = document.createElement("div");
        div.className = "message " + sender;
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return div;
    }
</script>
</body>
</html>
